<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50/50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ecosystem Control Workspace{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c084fc',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                        },
                        accent: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Outfit', sans-serif; }
        
        /* Premium custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-full text-slate-800 antialiased flex flex-col selection:bg-brand-100 selection:text-brand-900 relative">
    
    <!-- Premium glowing background shape matrix -->
    <div class="fixed inset-0 -z-50 overflow-hidden pointer-events-none">
        <div class="absolute -top-[30%] -left-[10%] w-[70%] h-[70%] rounded-full bg-brand-100/30 blur-[130px] animate-pulse-slow"></div>
        <div class="absolute -bottom-[30%] -right-[10%] w-[70%] h-[70%] rounded-full bg-pink-100/20 blur-[130px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <nav class="w-full bg-white/75 backdrop-blur-md border-b border-slate-200/50 px-6 py-4 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white text-md font-bold shadow-md shadow-brand-500/10 font-display">
                    Ω
                </div>
                <div>
                    <span class="font-display font-black text-xs tracking-tight text-slate-900 uppercase block">Mentor Connect Core</span>
                    <span class="text-[9px] font-bold text-slate-400 tracking-wider uppercase block">Management Ecosystem</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                {% block nav_action %}
                    <span class="text-[10px] bg-brand-50 border border-brand-100 px-3 py-1 text-brand-700 font-bold rounded-full font-mono uppercase tracking-wide">
                        Active Secure Node
                    </span>
                {% endblock %}
            </div>
        </div>
    </nav>

    <main class="w-full max-w-7xl mx-auto px-6 py-10 flex-1 relative z-10 animate-fade-in">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full bg-white/50 backdrop-blur-xs border-t border-slate-200/40 py-6 mt-16">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider font-mono">
            <span>© 2026 Corporate Administration Suite</span>
            <span class="flex items-center gap-1.5 text-slate-300">
                Status: <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Node Connected
            </span>
        </div>
    </footer>

</body>
</html>
